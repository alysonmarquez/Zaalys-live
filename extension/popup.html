<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; font-family: system-ui, sans-serif; }
      body { width: 300px; margin: 0; padding: 16px; color: #161616; background: #fff; }
      h1 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
      .z { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: #ade74e; color: #0f1a01; font-weight: 900; font-size: 13px; }
      p { font-size: 12px; color: #666; margin: 6px 0 10px; }
      input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
      button { width: 100%; margin-top: 10px; border: 0; border-radius: 10px; padding: 9px; font-weight: 700; background: #ade74e; color: #0f1a01; cursor: pointer; }
      button.ghost { background: #f2f2f2; color: #333; }
      .status { font-size: 12px; font-weight: 700; margin-top: 10px; }
      .ok { color: #16a34a; } .err { color: #dc2626; }
      .v { font-size: 11px; color: #999; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1><span class="z">Z</span> Zaalys Live</h1>
    <p id="help">Abra Configurações no Zaalys e toque em <b>Conectar neste navegador</b>, ou cole sua chave aqui.</p>
    <div id="form">
      <input id="key" autocomplete="off" spellcheck="false" placeholder="Sua chave (24 letras e números)" />
      <button id="activate">Conectar</button>
    </div>
    <button id="disconnect" class="ghost" hidden>Desconectar este navegador</button>
    <div id="status" class="status"></div>
    <div class="v" id="v"></div>
    <script src="popup.js"></script>
  </body>
</html>
